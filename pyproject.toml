[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "futures_portfolio"
version = "2.0.0"
description = "Market Neutral Futures Trading System — Binance Futures"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.11"
authors = [
    {name = "FMProducer"},
]
dependencies = [
    "python-binance==1.0.37",
    "pandas==3.0.3",
    "numpy==2.4.6",
    "python-dotenv==1.2.2",
    "aiohttp==3.14.1",
    "aiohttp-socks==0.11.0",
    "aiofiles==25.1.0",
    "filelock==3.29.7",
    "tenacity==9.1.4",
    "pyarrow==23.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "mock==5.2.0",
]

# ══════════════════════════════════════════════════════════════
#  Pytest
# ══════════════════════════════════════════════════════════════
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
asyncio_mode = "auto"
addopts = "-ra -v --tb=short"
markers = [
    "integration: tests requiring historical data or backtest; skip in CI",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

# ══════════════════════════════════════════════════════════════
#  Coverage
# ══════════════════════════════════════════════════════════════
[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "__pycache__/*",
    "backtest/*",
    "optimization/*",
    "tools/*",
    "scripts/*",
    "monitoring/*",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
    "pass",
    "except Exception",
]

# ══════════════════════════════════════════════════════════════
#  MyPy
# ══════════════════════════════════════════════════════════════
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

# ══════════════════════════════════════════════════════════════
#  Ruff
# ══════════════════════════════════════════════════════════════
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
