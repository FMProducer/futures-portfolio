[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "futures_portfolio"
version = "2.0.0"
description = "Market Neutral Futures Trading System — Binance Futures"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.11"
authors = [
    {name = "FMProducer"},
]
dependencies = [
    "aiohttp>=3.9",
    "python-dotenv>=1.0",
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1",
]

# ══════════════════════════════════════════════════════════════
#  Pytest
# ══════════════════════════════════════════════════════════════
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
asyncio_mode = "auto"
addopts = "-ra -v --tb=short"
markers = [
    "integration: tests requiring historical data or backtest; skip in CI",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

# ══════════════════════════════════════════════════════════════
#  Coverage
# ══════════════════════════════════════════════════════════════
[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "__pycache__/*",
    "backtest/*",
    "optimization/*",
    "tools/*",
    "scripts/*",
    "monitoring/*",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
    "pass",
    "except Exception",
]

# ══════════════════════════════════════════════════════════════
#  MyPy
# ══════════════════════════════════════════════════════════════
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

# ══════════════════════════════════════════════════════════════
#  Ruff
# ══════════════════════════════════════════════════════════════
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
